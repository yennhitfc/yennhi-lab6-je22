<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">

    <!-- 🔥 SEARCH + SORT + CATEGORY -->
    <form method="get" action="/books" class="mb-3 d-flex gap-2">

        <input type="text" name="keyword"
               placeholder="🔍 Tìm kiếm..."
               th:value="${keyword}"
               class="form-control w-25">

        <select name="sort" class="form-select w-25">
            <option value="">Sort</option>
            <option value="asc" th:selected="${sort=='asc'}">Giá tăng</option>
            <option value="desc" th:selected="${sort=='desc'}">Giá giảm</option>
        </select>

        <select name="category" class="form-select w-25">
            <option value="">Category</option>
            <option value="IT" th:selected="${category=='IT'}">IT</option>
            <option value="Business" th:selected="${category=='Business'}">Business</option>
            <option value="Novel" th:selected="${category=='Novel'}">Novel</option>
        </select>

        <button class="btn btn-primary">OK</button>
    </form>

    <!-- ADD -->
    <div class="d-flex justify-content-end mb-3">
        <a href="/books/add" class="btn btn-success">+ Thêm sách mới</a>
    </div>

    <!-- TABLE -->
    <table class="table table-bordered text-center">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tiêu đề</th>
            <th>Hình ảnh</th>
            <th>Giá</th>
            <th>Tác giả</th>
            <th>Chức năng</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>

            <td>
                <img th:src="@{${book.image}}" width="80">
            </td>

            <td th:text="${book.price}"></td>
            <td th:text="${book.author}"></td>

            <td>
                <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning btn-sm">Sửa</a>

                <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger btn-sm">Xóa</a>

                <!-- 🔥 ADD TO CART (ĐÚNG VỊ TRÍ) -->
                <a th:href="@{/books/add-to-cart/{id}(id=${book.id})}"
                   class="btn btn-success btn-sm">
                    Thêm giỏ
                </a>

<a href="/books/cart" class="btn btn-info mb-3">🛒 Xem giỏ hàng</a>

            </td>
        </tr>
        </tbody>
    </table>

    <!-- 🔥 PAGINATION -->
    <div class="d-flex justify-content-center mt-3">

        <a th:if="${currentPage > 0}"
           th:href="@{/books(page=${currentPage - 1}, keyword=${keyword}, sort=${sort}, category=${category})}"
           class="btn btn-primary me-2">
            ⬅ Previous
        </a>

        <span class="align-self-center">
            Trang <b th:text="${currentPage + 1}"></b> /
            <b th:text="${totalPages}"></b>
        </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/books(page=${currentPage + 1}, keyword=${keyword}, sort=${sort}, category=${category})}"
           class="btn btn-primary ms-2">
            Next ➡
        </a>
    </div>

</div>
</body>
</html>
