<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">

    <h2>🛒 Giỏ hàng</h2>

    <table class="table table-bordered text-center">
        <thead class="table-dark">
        <tr>
            <th>Tên</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Tổng</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${cart}">
            <td th:text="${item.book.title}"></td>
            <td th:text="${item.book.price}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.book.price * item.quantity}"></td>
        </tr>
        </tbody>
    </table>

    <h4>Tổng tiền: <span th:text="${total}"></span> VNĐ</h4>

    <a href="/books" class="btn btn-secondary">← Quay lại</a>
    <a href="/books/checkout" class="btn btn-success">Thanh toán</a>

</div>
</body>
</html>
